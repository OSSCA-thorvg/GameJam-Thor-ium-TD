<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e1b24">
  <link rel="icon" href="data:,">
  <title>Thor-ium TD · First Playable</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e1b24;font-family:system-ui,sans-serif}
    canvas{display:block;width:100vw;height:100dvh;touch-action:none;outline:none}
    #boot{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:12px;background:#0e1b24;color:#f1c066;padding:24px}
    #boot[hidden]{display:none}h1,p{margin:0}h1{font-size:28px;letter-spacing:.06em}p{font-size:14px;color:#a5bcb8;max-width:500px}
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Thor-ium TD 게임. 숫자 1부터 4로 카드 선택, 탭과 엔터로 버튼 조작, 스페이스로 전투 시작 또는 정지. S로 음소거, V로 볼륨 조절."></canvas>
  <div id="boot" role="status"><h1>THOR-IUM TD</h1><p id="status">광부와 방어대를 준비하고 있어요…</p></div>
  <script>
    /** Emscripten's host owns loading and the canvas; game UI lives in C++. */
    var Module = {
      canvas: document.getElementById('canvas'),
      /** Reflect loader progress without exposing gameplay state in the DOM. @param {string} text @returns {void} */
      setStatus(text) { if (text) document.getElementById('status').textContent = text.startsWith('Downloading') ? '게임 파일을 불러오는 중…' : '게임을 시작하는 중…'; },
      /** Hand focus to SDL after the runtime and packaged assets are ready. @returns {void} */
      onRuntimeInitialized() { document.getElementById('boot').hidden = true; document.getElementById('canvas').focus(); },
      /** Show an actionable load failure instead of an empty canvas. @param {unknown} reason @returns {void} */
      onAbort(reason) { document.getElementById('boot').hidden = false; document.getElementById('status').textContent = '게임을 불러오지 못했어요. 새로고침해 주세요. ' + String(reason); },
      printErr: (...items) => console.error(...items)
    };
    document.getElementById('canvas').addEventListener('contextmenu', event => event.preventDefault());
  </script>
  <script async src="./thorium.js"></script>
</body>
</html>
